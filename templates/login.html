{% extends 'base.html' %}

{% block title %}Log in - IELTSMASTER{% endblock %}

{% block content %}
<div class="container" style="min-height: 75vh; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem;">
  <div style="max-width: 380px; width: 100%;">
    <!-- Header -->
    <div style="text-align: center; margin-bottom: 2rem;">
      <h1 style="font-size: 1.4rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.35rem;">
        Log in to IELTSMASTER
      </h1>
      <p style="font-size: 0.88rem; color: var(--text-muted);">
        Enter your credentials to continue your preparation
      </p>
    </div>

    <!-- Error Alert -->
    {% if error %}
    <div style="background: var(--danger-bg); border: 1px solid var(--danger-border); border-radius: var(--radius-sm); padding: 0.75rem 1rem; color: var(--danger); font-size: 0.85rem; margin-bottom: 1.25rem;">
      {{ error }}
    </div>
    {% endif %}

    <!-- Form -->
    <form method="POST" action="{{ url_for('login') }}">
      <div style="margin-bottom: 1.25rem;">
        <label for="identifier" style="display: block; font-size: 0.85rem; font-weight: 500; color: var(--text-primary); margin-bottom: 0.4rem;">
          Username or Email
        </label>
        <input 
          type="text" 
          id="identifier" 
          name="identifier" 
          value="{{ identifier or '' }}"
          placeholder="username@example.com" 
          required 
          class="input"
        >
      </div>

      <div style="margin-bottom: 1.5rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
          <label for="password" style="font-size: 0.85rem; font-weight: 500; color: var(--text-primary);">
            Password
          </label>
        </div>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="••••••••" 
          required 
          class="input"
        >
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-bottom: 1.25rem;">
        Log in
      </button>

      <div style="text-align: center; font-size: 0.85rem; color: var(--text-secondary);">
        Don't have an account? 
        <a href="{{ url_for('register') }}" style="font-weight: 500;">Sign up</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
